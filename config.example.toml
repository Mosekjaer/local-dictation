# local-dictation configuration
# Path: ~/.config/local-dictation/config.toml
#
# All keys are optional; omitted keys fall back to the defaults shown here.
# Use $ENV or ~ in path values; they expand at load time.

# ---------------- whisper.cpp ----------------
whisper_cli         = "~/stt-bench/whisper.cpp/build-vulkan/bin/whisper-cli"
whisper_server_bin  = "~/stt-bench/whisper.cpp/build-vulkan/bin/whisper-server"
model               = "~/stt-bench/whisper.cpp/models/ggml-small.bin"
# VAD model used by whisper-server during --live. Set to an empty string
# to disable VAD (live mode will hallucinate more during silence).
vad_model           = "~/stt-bench/whisper.cpp/models/for-tests-silero-v6.2.0-ggml.bin"
# Language for whisper-cli. "auto" omits the -l flag and lets whisper detect.
# One of: "auto", "da", "en".
language            = "auto"

# ---------------- audio (ffmpeg) -------------
# PulseAudio source name. "default" follows the system default source
# (PipeWire's pipewire-pulse shim is fine).
audio_source = "default"
channels     = 1
sample_rate  = 16000
temp_dir     = "~/.cache/local-dictation/recordings"

# ---------------- output ---------------------
# Paste fallback strategy. "auto" picks the best available, in order:
#   wtype        -> direct typing via wlroots virtual-keyboard protocol
#                   (no clipboard mutation; may not work on COSMIC)
#   ydotool_type -> direct typing via `ydotool type` (no clipboard
#                   mutation; layout-dependent, needs ydotoold)
#   ydotool      -> wl-copy + synthesised Ctrl+V via ydotool key
#                   (mutates clipboard; needs ydotoold)
#   clipboard    -> wl-copy only; user pastes manually
# One of: "auto", "wtype", "ydotool_type", "ydotool", "clipboard".
paste_method      = "auto"
# When true, save the current clipboard before pasting and restore it
# afterwards via a detached helper. Only text/plain;utf-8 is preserved.
restore_clipboard = true

# ---------------- live typing ----------------
# Stream the transcript at the cursor while you are still speaking,
# rather than batch-typing on release. Accuracy is noticeably worse
# than batch mode and you will occasionally see whisper revise the last
# few characters. Push-to-talk batch mode remains the default.
#
# CLI flags `--live` / `--no-live` on `toggle` and `start` override
# this per-invocation.
live_typing                = false
# Sliding-window re-transcription interval (ms). Lower = lower latency
# but higher whisper-server load.
live_chunk_ms              = 500
# Ring buffer window (seconds). Whisper sees at most this much trailing
# audio per pass. 10 s is the upper bound of whisper's training context.
live_window_s              = 10
# A character prefix is "committed" (typed) once it has been identical
# across this many consecutive transcription passes. Lower = faster
# commit but more visible revisions. Higher = fewer corrections but
# slower text appearance.
live_stable_passes         = 2
# Drop the well-known silence-hallucinations ("you", "thanks for
# watching", "[music]", ".") from the tentative tail.
live_hallucination_filter  = true
# whisper-server is spawned lazily by the daemon on the first --live
# request and reused across the daemon's lifetime.
whisper_server_host        = "127.0.0.1"
whisper_server_port        = 38080

# ---------------- ui -------------------------
# Desktop notifications. One of:
#   "all"          -> fire on every state transition (recording, transcribing,
#                     pasted, error)
#   "errors_only"  -> only fire on errors and when paste fell back to
#                     clipboard-only (so you know to press Ctrl+V manually)
#   "none"         -> never fire (rely on the equalizer applet alone)
# Legacy values true/false are accepted as aliases for "all"/"none".
notifications = "all"
# Optional always-on-top GTK status window. Defaults to off; requires
# python3-gi which ships on Pop!_OS.
status_window = false

# ---------------- logging --------------------
log_file  = "~/.cache/local-dictation/local-dictation.log"
log_level = "INFO"   # DEBUG | INFO | WARNING | ERROR

# ---------------- ipc ------------------------
# Unix socket the CLI uses to talk to the daemon. Defaults to
# $XDG_RUNTIME_DIR/local-dictation.sock; override only if you know why.
# socket_path = "/run/user/1000/local-dictation.sock"

# Push-style event broadcast socket consumed by the COSMIC panel applet.
# Subscribers receive newline-delimited JSON events (state, meter, hello).
# Defaults to $XDG_RUNTIME_DIR/local-dictation-events.sock; override only
# if you know why. Permissions are forced to 0600.
# events_socket_path = "/run/user/1000/local-dictation-events.sock"
